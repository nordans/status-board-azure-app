apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: status-board-redirect
  namespace: status-board-ingress
spec:
  parentRefs:
    - name: status-board-public
      sectionName: http
  hostnames:
    - __PUBLIC_HOSTNAME__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: status-board-https
  namespace: status-board-ingress
spec:
  parentRefs:
    - name: status-board-public
      sectionName: https
  hostnames:
    - __PUBLIC_HOSTNAME__
  rules:
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /health
        - path:
            type: PathPrefix
            value: /static
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=86400
      backendRefs:
        - name: status-board
          namespace: status-board
          port: 8000
