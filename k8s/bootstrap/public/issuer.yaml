apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-__ACME_ENVIRONMENT__
  namespace: status-board-ingress
spec:
  acme:
    server: __ACME_SERVER__
    privateKeySecretRef:
      name: letsencrypt-account-__ACME_ENVIRONMENT__
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: status-board-public
                namespace: status-board-ingress
                sectionName: http
            serviceType: ClusterIP
            podTemplate:
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  seccompProfile:
                    type: RuntimeDefault
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 100m
                    memory: 64Mi
