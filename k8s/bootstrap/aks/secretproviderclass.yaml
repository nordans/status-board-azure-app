apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: status-board-key-vault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: __APP_CLIENT_ID__
    keyvaultName: __KEY_VAULT_NAME__
    tenantId: __TENANT_ID__
    objects: |
      array:
        - |
          objectName: status-board-admin-token
          objectType: secret
          objectAlias: admin_api_token
          filePermission: "0444"
