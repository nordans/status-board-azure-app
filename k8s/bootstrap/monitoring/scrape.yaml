apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-prometheus-config
  namespace: kube-system
data:
  prometheus-config: |-
    scrape_configs:
      - job_name: status-board
        scrape_interval: 30s
        scrape_timeout: 5s
        metrics_path: /metrics
        static_configs:
          - targets: [status-board.status-board.svc.cluster.local:8000]
            labels:
              namespace: status-board
