apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-board
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: status-board
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status-board
    spec:
      serviceAccountName: status-board
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: status-board
          image: status-board:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: status-board-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: "1"
              memory: 256Mi
              ephemeral-storage: 64Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: admin-token
              mountPath: /run/secrets
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: admin-token
          secret:
            secretName: status-board-admin
            defaultMode: 0440
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
