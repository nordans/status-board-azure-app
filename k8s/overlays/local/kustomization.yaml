apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: status-board
    newTag: local-k8s
patches:
  - target:
      kind: ConfigMap
      name: status-board-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: local-k8s
  - target:
      kind: Deployment
      name: status-board
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
