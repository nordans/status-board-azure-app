services:
  status-board:
    build:
      context: .
      target: runtime
    image: status-board:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-dev}
      BOARD_TITLE: ${BOARD_TITLE:-Platform Status}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_API_TOKEN_FILE: /run/secrets/admin_api_token
    secrets:
      - admin_api_token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    stop_grace_period: 15s

secrets:
  admin_api_token:
    file: ./.secrets/admin_api_token
