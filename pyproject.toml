[project]
name = "status-board"
version = "0.1.0"
description = "Service status dashboard with authenticated status reporting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.14,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pip-audit>=2.10,<3",
    "pytest>=8,<10",
    "ruff>=0.17,<1",
]

[tool.uv]
package = false
required-version = "==0.13.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
line-ending = "lf"
