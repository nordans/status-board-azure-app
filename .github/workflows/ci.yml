name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_image:
        description: Build the application image and run container smoke tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm --network none
          --volume "$PWD:/repo:ro" --workdir /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Scan git history for secrets
        run: >-
          docker run --rm --network none
          --volume "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --log-opts="--all"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Check dependency lock
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint Python
        run: uv run --locked --no-sync ruff check .

      - name: Check Python formatting
        run: uv run --locked --no-sync ruff format --check .

      - name: Run tests
        run: uv run --locked --no-sync pytest

      - name: Validate monitoring configuration and alert behavior
        run: |
          docker run --rm --network none --entrypoint /bin/promtool --volume "$PWD/observability:/etc/prometheus:ro" prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 check config /etc/prometheus/prometheus.yaml
          docker run --rm --network none --entrypoint /bin/promtool --volume "$PWD/observability:/etc/prometheus:ro" prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 test rules /etc/prometheus/rule-tests.json
          docker run --rm --network none --entrypoint /bin/amtool --volume "$PWD/observability:/etc/observability:ro" prom/alertmanager@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a check-config /etc/observability/alertmanager.yaml

      - name: Audit dependencies
        run: |
          uv export --locked --all-groups --no-emit-project --no-header --no-annotate --quiet --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uv run --locked --no-sync pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements-audit.txt"

      # Keep application image builds opt-in to avoid unnecessary development runs.
      - name: Build image and run container smoke tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_image }}
        run: |
          uv run --locked --no-sync python scripts/new_local_secret.py
          docker compose up --build --detach --wait --wait-timeout 90
          uv run --locked --no-sync python scripts/smoke_test.py
          test "$(docker compose exec -T status-board id -u)" = "10001"

      - name: Stop containers
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.build_image }}
        run: docker compose down
