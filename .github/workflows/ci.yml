name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_image:
        description: Build the application image and run container smoke tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history for secrets
        run: >-
          docker run --rm --network none
          --volume "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --log-opts="--all"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest

      - name: Audit dependencies
        run: python -m pip_audit --require-hashes -r requirements-dev.txt

      # Build application images on demand to conserve CI minutes during development.
      - name: Build image and run container smoke tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_image }}
        run: |
          python scripts/new_local_secret.py
          docker compose up --build --detach --wait --wait-timeout 90
          python scripts/smoke_test.py
          test "$(docker compose exec -T status-board id -u)" = "10001"

      - name: Stop containers
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.build_image }}
        run: docker compose down
