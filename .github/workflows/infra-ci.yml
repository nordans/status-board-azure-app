name: Infrastructure CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Infrastructure CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Validate Terraform configurations
        run: |
          for root in infra/bootstrap infra/environments/dev; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate -no-color
          done

      - name: Test infrastructure security boundaries
        run: |
          for root in infra/bootstrap infra/environments/dev; do
            terraform -chdir="$root" test -no-color
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        with:
          tflint_version: v0.65.0

      - name: Initialize TFLint plugins
        run: tflint --init --config "$GITHUB_WORKSPACE/infra/.tflint.hcl"

      - name: Lint Terraform
        run: tflint --recursive --chdir=infra --config "$GITHUB_WORKSPACE/infra/.tflint.hcl"

      - name: Scan infrastructure configuration
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro" --workdir /repo
          aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          config --severity HIGH,CRITICAL --exit-code 1
          --ignorefile infra/.trivyignore.yaml infra
