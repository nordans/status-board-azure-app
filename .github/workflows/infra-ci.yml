name: Infrastructure CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Infrastructure CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Validate Terraform configurations
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-providers
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for module in infra/modules/*; do
            if [ "$module" = infra/modules/aks ] || [ "$module" = infra/modules/monitoring ]; then
              cp infra/environments/dev/.terraform.lock.hcl "$module/.terraform.lock.hcl"
            else
              cp infra/bootstrap/.terraform.lock.hcl "$module/.terraform.lock.hcl"
            fi
          done
          for root in infra/bootstrap infra/delivery infra/environments/dev infra/modules/*; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate -no-color
          done

      - name: Test infrastructure security boundaries
        run: |
          for root in infra/bootstrap infra/delivery infra/environments/dev infra/modules/*; do
            terraform -chdir="$root" test -no-color
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        with:
          tflint_version: v0.65.0

      - name: Initialize TFLint plugins
        run: tflint --init --config "$GITHUB_WORKSPACE/infra/.tflint.hcl"

      - name: Lint Terraform
        run: tflint --recursive --chdir=infra --config "$GITHUB_WORKSPACE/infra/.tflint.hcl"

      - name: Scan infrastructure configuration
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro" --workdir /repo
          aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          config --severity HIGH,CRITICAL --exit-code 1
          --ignorefile infra/.trivyignore.yaml infra

      - name: Scan Kubernetes configuration
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro" --workdir /repo
          aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          config --severity HIGH,CRITICAL --exit-code 1 k8s

      - name: Scan monitoring configuration
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro" --workdir /repo
          aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          config --severity HIGH,CRITICAL --exit-code 1 observability

      - name: Set up kubectl for manifest rendering
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
        with:
          version: v1.36.5

      - name: Render AKS configurations
        run: |
          mkdir -p "$RUNNER_TEMP/rendered-k8s"
          kubectl kustomize k8s/bootstrap/monitoring > "$RUNNER_TEMP/rendered-k8s/monitoring.yaml"
          python3 scripts/render_aks.py bootstrap --app-client-id 00000000-0000-0000-0000-000000000001 --tenant-id 00000000-0000-0000-0000-000000000002 --key-vault-name kv-example --output "$RUNNER_TEMP/rendered-k8s/bootstrap.yaml"
          python3 scripts/render_aks.py application --image-repository example.azurecr.io/status-board --image-digest "sha256:$(printf '%064d' 0)" --app-version "$GITHUB_SHA" --output "$RUNNER_TEMP/rendered-k8s/application.yaml"
          python3 scripts/render_aks.py public --public-dns-label statusboard-example --public-hostname statusboard-example.northeurope.cloudapp.azure.com --output "$RUNNER_TEMP/rendered-k8s/public-staging.yaml"
          python3 scripts/render_aks.py public --public-dns-label statusboard-example --public-hostname statusboard-example.northeurope.cloudapp.azure.com --acme-environment production --output "$RUNNER_TEMP/rendered-k8s/public-production.yaml"

      - name: Scan rendered AKS configuration
        run: >-
          docker run --rm --volume "$RUNNER_TEMP/rendered-k8s:/manifests:ro"
          aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          config --severity HIGH,CRITICAL --exit-code 1 /manifests
